name: Issue Automation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  automate:
    name: Issue Automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # Required to create the contract labels, label the issue, and comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read issue metadata
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          printf '%s' "$ISSUE_TITLE" > "$RUNNER_TEMP/issue-title.txt"
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.md"

          # An incomplete issue is reported as data, so the run stays green and
          # the reporter is told what is missing instead of seeing a failed check.
          ruby .github/scripts/issue-metadata.rb json \
            --title-file "$RUNNER_TEMP/issue-title.txt" \
            --body-file "$RUNNER_TEMP/issue-body.md" > "$RUNNER_TEMP/metadata.json"
          ruby .github/scripts/issue-metadata.rb labels > "$RUNNER_TEMP/contract-labels.json"

          jq '{kind, form, formDetected, area, labels, valid}' "$RUNNER_TEMP/metadata.json"

      - name: Create missing labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/labels?per_page=100" \
            | jq 'flatten(1) | [.[].name]' > "$RUNNER_TEMP/existing-labels.json"

          jq -r --slurpfile have "$RUNNER_TEMP/existing-labels.json" \
            '.[] | . as $entry
             | select(($have[0] | index($entry.label)) == null)
             | [$entry.label, $entry.color, $entry.description] | @tsv' \
            "$RUNNER_TEMP/contract-labels.json" > "$RUNNER_TEMP/missing-labels.tsv"

          while IFS=$'\t' read -r name color description; do
            [ -n "$name" ] || continue
            jq -n --arg name "$name" --arg color "$color" --arg description "$description" \
              '{name: $name, color: $color, description: $description}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/labels" --input - >/dev/null
            echo "::notice::Created label $name"
          done < "$RUNNER_TEMP/missing-labels.tsv"

      - name: Apply contract labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          metadata="$RUNNER_TEMP/metadata.json"
          current="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels" --jq '[.[].name]')"

          # Only labels this contract owns are removed, so every manually curated
          # label survives an edit.
          printf '%s' "$current" | jq -r --slurpfile meta "$metadata" \
            '. - $meta[0].labels | map(select(. as $name | $meta[0].managedLabels | index($name))) | .[]' \
            > "$RUNNER_TEMP/stale-labels.txt"

          while IFS= read -r label; do
            [ -n "$label" ] || continue
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/$label" >/dev/null
            echo "::notice::Removed stale label $label"
          done < "$RUNNER_TEMP/stale-labels.txt"

          # Adding a label the issue already carries is a no-op, so a repeated
          # edit converges on the same set.
          if [ "$(jq '.labels | length' "$metadata")" -eq 0 ]; then
            echo '::warning::The title declares no kind and the body no area, so no label was applied.'
            exit 0
          fi

          jq '{labels: .labels}' "$metadata" \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels" \
              --input - >/dev/null
          echo "::notice::Applied $(jq -r '.labels | join(", ")' "$metadata")"

      - name: Report the contract result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MARKER: "<!-- zisla-issue-contract -->"
        run: |
          set -euo pipefail

          metadata="$RUNNER_TEMP/metadata.json"
          comments="$RUNNER_TEMP/comments.json"
          feedback="$RUNNER_TEMP/feedback.md"

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            | jq 'flatten(1)' > "$comments"

          # The marker keeps every run editing one comment instead of adding a
          # new one on each edit.
          existing="$(MARKER="$MARKER" jq -r '
            map(select(.user.login == "github-actions[bot]"
              and (.body | contains(env.MARKER)))) | last | .id // empty
          ' "$comments")"

          valid="$(jq -r '.valid' "$metadata")"
          if [ "$valid" = 'true' ] && [ -z "$existing" ]; then
            echo '::notice::The issue satisfies the form contract.'
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo '### Issue form check'
            echo
            if [ "$valid" = 'true' ]; then
              echo 'Resolved: the title and every required field now follow the Issue Form. Thank you.'
            else
              echo 'This issue cannot be triaged yet. Please edit it to address the following:'
              echo
              jq -r '.errors[] | "- " + .' "$metadata"
              echo
              echo 'This comment updates itself after each edit.'
            fi
          } > "$feedback"

          if [ -n "$existing" ] && [ "$(jq -r --rawfile body "$feedback" --argjson id "$existing" \
            'map(select(.id == $id)) | last | .body == $body' "$comments")" = 'true' ]; then
            echo '::notice::The issue form feedback is already up to date.'
            exit 0
          fi

          payload="$RUNNER_TEMP/comment.json"
          jq -n --rawfile body "$feedback" '{body: $body}' > "$payload"

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              --input "$payload" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              --input "$payload" >/dev/null
          fi

      - name: Remove issue metadata files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/issue-title.txt" "$RUNNER_TEMP/issue-body.md" \
            "$RUNNER_TEMP/metadata.json" "$RUNNER_TEMP/contract-labels.json" \
            "$RUNNER_TEMP/existing-labels.json" "$RUNNER_TEMP/missing-labels.tsv" \
            "$RUNNER_TEMP/stale-labels.txt" "$RUNNER_TEMP/comments.json" \
            "$RUNNER_TEMP/feedback.md" "$RUNNER_TEMP/comment.json"
