name: Swift Tests

on:
  pull_request:
    branches:
      - main
      - "publish-v*"
  push:
    branches:
      - main
      - "publish-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Skip Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      relevant: ${{ steps.gate.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-skip-gate
        with:
          workflow-name: Swift Tests
          github-token: ${{ github.token }}

  test:
    name: Swift Tests
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - name: Check shell script syntax
        run: |
          for script in Scripts/*.sh; do
            case "$(head -n 1 "$script")" in
              "#!/bin/zsh") zsh -n "$script" ;;
              "#!/usr/bin/env bash") bash -n "$script" ;;
              *) echo "Unsupported shell in $script" >&2; exit 1 ;;
            esac
          done
      - name: Run shell script tests
        run: |
          for test_script in Tests/ScriptTests/*.zsh; do
            zsh "$test_script"
          done
      - name: Build Swift tests
        run: |
          swift build --build-tests
      - name: Run Swift core tests
        run: |
          zsh Scripts/swift-test.sh --skip-build --filter '^ZislaCoreTests\.'
      - name: Run isolated Swift suites
        env:
          SWIFT_TEST_WORKERS: "3"
        run: |
          zsh Scripts/swift-test-suites.sh ZislaKitTests --skip-build
          zsh Scripts/swift-test-suites.sh ZislaTests --skip-build
      - name: Remove test artifacts
        if: always()
        run: rm -rf .build

  app-smoke:
    name: App Build Smoke Test
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ad-hoc signed app (single architecture)
        env:
          VERSION: "0.1.0"
          BUILD_NUMBER: "1"
          UPDATE_CHANNEL: "preview"
          OUTPUT_DIRECTORY: ${{ runner.temp }}/zisla-app
          CODE_SIGN_IDENTITY: "-"
          SPARKLE_PUBLIC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: BUILD_ARCHITECTURES="$(uname -m)" ./Scripts/build-app.sh
      - name: Verify app bundle structure
        run: |
          APP_PATH="${{ runner.temp }}/zisla-app/zisla.app"
          test -d "$APP_PATH" || { echo "zisla.app not found"; exit 1; }
          test -f "$APP_PATH/Contents/MacOS/zisla" || { echo "zisla binary not found"; exit 1; }
          test -x "$APP_PATH/Contents/MacOS/zisla" || { echo "zisla binary not executable"; exit 1; }
          test -f "$APP_PATH/Contents/Info.plist" || { echo "Info.plist not found"; exit 1; }
          ZISLAKIT_BUNDLE="$APP_PATH/Contents/Resources/zisla_ZislaKit.bundle"
          test -d "$ZISLAKIT_BUNDLE" || { echo "ZislaKit resource bundle not found"; exit 1; }
          SOUND_COUNT="$(find "$ZISLAKIT_BUNDLE" -type f -name 'pomodoro-complete.m4a' -size +0c | wc -l | tr -d ' ')"
          test "$SOUND_COUNT" = 1 || { echo "Pomodoro completion sound not found uniquely in ZislaKit bundle"; exit 1; }
          /usr/bin/plutil -lint "$APP_PATH/Contents/Info.plist"
          /usr/bin/codesign --verify --deep --strict --all-architectures --verbose=2 "$APP_PATH"
      - name: Build and verify zislactl in Release mode
        run: |
          ARCHITECTURE="$(uname -m)"
          BUILD_ARGS=(-c release --disable-sandbox --scratch-path ".build/$ARCHITECTURE" --triple "$ARCHITECTURE-apple-macosx" -Xswiftc -DSWIFT_MODULE_RESOURCE_BUNDLE_UNAVAILABLE)
          swift build "${BUILD_ARGS[@]}" --product zislactl
          BIN_PATH="$(swift build "${BUILD_ARGS[@]}" --show-bin-path)"
          test -x "$BIN_PATH/zislactl"
          HOME="${{ runner.temp }}/zislactl-home" "$BIN_PATH/zislactl" --help
      - name: Remove build artifacts
        if: always()
        run: rm -rf .build "${{ runner.temp }}/zisla-app" "${{ runner.temp }}/zislactl-home"

  codeql:
    name: CodeQL (swift)
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build all Swift products for CodeQL
        run: swift build
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:swift
      - name: Remove build artifacts
        if: always()
        run: rm -rf .build
