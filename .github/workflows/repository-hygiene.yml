name: Repository Hygiene

on:
  pull_request:
    branches:
      - main
      - "publish-v*"
  push:
    branches:
      - main
      - "publish-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Skip Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-skip-gate
        with:
          workflow-name: Repository Hygiene
          github-token: ${{ github.token }}

  check:
    name: Repository Hygiene
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check committed files
        run: .github/scripts/check-repository-hygiene.sh
