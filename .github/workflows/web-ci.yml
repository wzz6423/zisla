name: Web CI

on:
  pull_request:
    branches:
      - main
      - "publish-v*"
  push:
    branches:
      - main
      - "publish-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Skip Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      relevant: ${{ steps.gate.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-skip-gate
        with:
          workflow-name: Web CI
          github-token: ${{ github.token }}

  build:
    name: Web Build & Test
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if web directory exists
        id: check-web
        run: |
          if [ ! -d "web" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "web directory not present in this revision."
          elif [ -f "web/package.json" ] && [ -f "web/package-lock.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "web/package.json and web/package-lock.json are both required." >&2
            exit 1
          fi

      - name: Setup Node.js
        if: steps.check-web.outputs.exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm ci

      - name: Type check
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Lint
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm run lint --if-present

      - name: Test
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm run test --if-present

      - name: Build
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm run build

      - name: Audit production dependencies
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Verify build artifacts
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: |
          test -f dist/index.html || { echo "dist/index.html not found"; exit 1; }
          test -s dist/index.html || { echo "dist/index.html is empty"; exit 1; }
          test -d dist/assets || { echo "dist/assets directory not found"; exit 1; }
          ASSET_COUNT=$(find dist/assets -type f | wc -l | tr -d ' ')
          test "$ASSET_COUNT" -gt 0 || { echo "No assets found in dist/assets"; exit 1; }
          echo "Build artifacts verified: index.html exists and non-empty, $ASSET_COUNT asset(s) found"

      - name: Upload build artifacts
        if: steps.check-web.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Web-Build
          path: web/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Clean up build artifacts
        if: always() && steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: rm -rf dist node_modules

  codeql:
    name: CodeQL (JavaScript)
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if web directory exists
        id: check-web
        run: |
          if [ -d "web" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "web directory not present in this revision."
          fi

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: steps.check-web.outputs.exists == 'true'
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: steps.check-web.outputs.exists == 'true'
        with:
          category: /language:javascript-typescript
