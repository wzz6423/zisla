name: Skill CI

on:
  pull_request:
    branches:
      - main
      - "publish-v*"
  push:
    branches:
      - main
      - "publish-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Syntax check validator
        run: |
          ruby -c .github/scripts/validate-skills.rb
          ruby -c .github/scripts/validate-skills-test.rb

      - name: Test skill validator
        run: ruby .github/scripts/validate-skills-test.rb

      - name: Run skill validation
        run: ruby .github/scripts/validate-skills.rb
