name: Skill CI

on:
  pull_request:
    branches:
      - main
      - "publish-v*"
  push:
    branches:
      - main
      - "publish-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-skip-gate
        with:
          workflow-name: Skill CI
          github-token: ${{ github.token }}

      - name: Syntax check validator
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.relevant != 'false'
        run: |
          ruby -c .github/scripts/validate-skills.rb
          ruby -c .github/scripts/validate-skills-test.rb

      - name: Test skill validator
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.relevant != 'false'
        run: ruby .github/scripts/validate-skills-test.rb

      - name: Run skill validation
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.relevant != 'false'
        run: ruby .github/scripts/validate-skills.rb
