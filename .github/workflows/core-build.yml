name: Core Tests

on:
  pull_request:
    branches:
      - main
      - "publish-v*"
  push:
    branches:
      - main
      - "publish-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Skip Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      relevant: ${{ steps.gate.outputs.relevant }}
      core: ${{ steps.sources.outputs.core }}
      application: ${{ steps.sources.outputs.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-skip-gate
        with:
          workflow-name: Core Tests
          github-token: ${{ github.token }}
      - name: Check Windows source availability
        id: sources
        run: |
          core=false
          application=false
          if [ -f windows/CMakeLists.txt ]; then core=true; fi
          if [ -f windows/Zisla.Windows.sln ]; then application=true; fi
          printf 'core=%s\napplication=%s\n' "$core" "$application" >> "$GITHUB_OUTPUT"

  core-debug:
    name: Windows Core (Debug)
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false' && needs.gate.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CONFIGURATION: Debug
    steps: &core-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDirectory = Join-Path $env:RUNNER_TEMP "zisla-windows-core"
          if (-not (Test-Path -LiteralPath "windows/CMakeLists.txt")) {
            Write-Host "Windows Core is not present in this revision."
            exit 0
          }
          cmake -S windows -B "$buildDirectory" -G Ninja -DCMAKE_BUILD_TYPE=$env:CONFIGURATION -DBUILD_TESTING=ON -DZISLA_ENABLE_QPDF_ADAPTER=OFF -DZISLA_ENABLE_PDFIUM_ADAPTER=OFF
          cmake --build "$buildDirectory" --parallel
          ctest --test-dir "$buildDirectory" --output-on-failure --no-tests=error
      - name: Remove test artifacts
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "zisla-windows-core") -Recurse -Force -ErrorAction SilentlyContinue

  core-release:
    name: Windows Core (Release)
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false' && needs.gate.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CONFIGURATION: Release
    steps: *core-steps

  core-result:
    name: Windows Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, core-debug, core-release]
    if: always() && (needs.gate.result != 'success' || (needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false' && needs.gate.outputs.core == 'true'))
    steps:
      - name: Verify configuration results
        env:
          DEBUG_RESULT: ${{ needs.core-debug.result }}
          RELEASE_RESULT: ${{ needs.core-release.result }}
        run: test "$DEBUG_RESULT" = "success" && test "$RELEASE_RESULT" = "success"

  application:
    name: Windows App Build
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false' && needs.gate.outputs.application == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check if Windows application exists
        id: check-app
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "windows/Zisla.Windows.sln") {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Windows application is not present in this revision."
          }
      - name: Restore cached QPDF build
        if: steps.check-app.outputs.exists == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\zisla-qpdf
          key: windows-qpdf-v1-${{ hashFiles('windows/Scripts/build-qpdf.ps1', 'windows/Vendor/qpdf/12.3.2/**', 'windows/Vendor/zlib/1.3.2/**', 'windows/Vendor/libjpeg-turbo/3.2.0/**') }}
      - name: Build the Windows application
        if: steps.check-app.outputs.exists == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $qpdfBuildRoot = Join-Path $env:RUNNER_TEMP "zisla-qpdf"
          $qpdfLibrary = Join-Path $qpdfBuildRoot "prefix\lib\qpdf.lib"
          if (-not (Test-Path -LiteralPath $qpdfLibrary)) {
            .\windows\Scripts\build-qpdf.ps1 -Architecture x64 -Configuration Release -BuildRoot $qpdfBuildRoot
          }
          msbuild .\windows\Zisla.Windows.sln /restore /m /p:Configuration=Release /p:Platform=x64 /p:QPDFPrefix="$qpdfBuildRoot\prefix" /p:AppxPackage=false /p:GenerateAppxPackageOnBuild=false
      - name: Verify Zisla.exe
        if: steps.check-app.outputs.exists == 'true'
        shell: pwsh
        run: |
          $exePath = "windows\bin\x64\Release\Zisla.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            Write-Error "Zisla.exe not found at expected path: $exePath"
            exit 1
          }
          Write-Host "Zisla.exe found and verified"
      - name: Upload Windows application artifact
        if: steps.check-app.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Zisla-Windows-x64
          path: windows/bin/x64/Release/
          retention-days: 7
          if-no-files-found: error
      - name: Remove workspace artifacts
        if: always() && steps.check-app.outputs.exists == 'true'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "windows\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "windows\obj" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "windows\App\packages.lock.json" -Force -ErrorAction SilentlyContinue

  codeql:
    name: CodeQL (C/C++)
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false' && needs.gate.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check if Windows Core exists
        id: check-core
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "windows/CMakeLists.txt") {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Windows Core is not present in this revision."
          }
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: steps.check-core.outputs.exists == 'true'
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Build Core for CodeQL
        if: steps.check-core.outputs.exists == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDirectory = Join-Path $env:RUNNER_TEMP "zisla-codeql"
          cmake -S windows -B "$buildDirectory" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DZISLA_ENABLE_QPDF_ADAPTER=OFF -DZISLA_ENABLE_PDFIUM_ADAPTER=OFF
          cmake --build "$buildDirectory" --parallel
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: steps.check-core.outputs.exists == 'true'
        with:
          category: /language:c-cpp
      - name: Remove build artifacts
        if: always() && steps.check-core.outputs.exists == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "zisla-codeql") -Recurse -Force -ErrorAction SilentlyContinue
