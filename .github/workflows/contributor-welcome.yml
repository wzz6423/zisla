name: Contributor Welcome

on:
  issues:
    types: [opened, edited, reopened, closed]
  pull_request_target: # zizmor: ignore[dangerous-triggers] Only the default branch is checked out.
    types: [opened, edited, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      kind:
        description: Contribution kind to refresh
        required: true
        type: choice
        options: [issue, pr]
      number:
        description: Issue or pull request number to refresh
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.kind || (github.event_name == 'issues' && 'issue' || 'pr') }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false

jobs:
  welcome:
    name: Welcome Contributor
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # Required to create and refresh issue comments.
      pull-requests: write # Required to create and refresh pull request comments.
    env:
      CONTRIBUTION_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || (github.event_name == 'issues' && 'issue' || 'pr') }}
      CONTRIBUTION_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Render welcome message
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$CONTRIBUTION_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Contribution number must be a positive integer."
            exit 1
          fi
          .github/scripts/render-contributor-welcome.sh "$CONTRIBUTION_KIND" > "$RUNNER_TEMP/contributor-welcome.md"

      - name: Synchronize welcome message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          comment_body="$(<"$RUNNER_TEMP/contributor-welcome.md")"
          existing_comment="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$CONTRIBUTION_NUMBER/comments?per_page=100" | \
            jq -c '[.[][] | select(.user.login == "github-actions[bot]" and
              ((.body // "") | startswith("<!-- zisla-contributor-welcome -->")))] | first')"
          comment_id="$(jq -r '.id // empty' <<< "$existing_comment")"
          if jq -e --arg body "$comment_body" '.body == $body' <<< "$existing_comment" > /dev/null; then
            exit 0
          fi

          jq -n --arg body "$comment_body" '{body: $body}' > "$RUNNER_TEMP/contributor-welcome.json"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --input "$RUNNER_TEMP/contributor-welcome.json"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$CONTRIBUTION_NUMBER/comments" \
              --input "$RUNNER_TEMP/contributor-welcome.json"
          fi

      - name: Remove welcome message files
        if: always()
        run: rm -f "$RUNNER_TEMP/contributor-welcome.md" "$RUNNER_TEMP/contributor-welcome.json"
