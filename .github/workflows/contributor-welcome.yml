name: Contributor Welcome

on:
  issues:
    types: [opened]
  pull_request_target: # zizmor: ignore[dangerous-triggers] Only the default branch is checked out.
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  welcome:
    name: Welcome Contributor
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # Required to comment on newly opened issues.
      pull-requests: write # Required to comment on newly opened pull requests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Render welcome message
        env:
          CONTRIBUTION_KIND: ${{ github.event_name == 'issues' && 'issue' || 'pr' }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          .github/scripts/render-contributor-welcome.sh "$CONTRIBUTION_KIND" > "$RUNNER_TEMP/contributor-welcome.md"

      - name: Post welcome message
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRIBUTION_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          comment_body="$(<"$RUNNER_TEMP/contributor-welcome.md")"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$CONTRIBUTION_NUMBER/comments" \
            --raw-field "body=$comment_body"
