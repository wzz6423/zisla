# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary_instructions: >-
    Write the summary in English under one heading, ## Summary by CodeRabbit.
    Include one fenced mermaid block starting with flowchart TD to explain the
    changed behavior or data flow, including CI and configuration changes.
    Use stable alphanumeric node IDs with square-bracketed, double-quoted labels,
    for example A["PR opened"] --> B["Run checks"]. Connect previously defined
    nodes using their IDs, for example A --> B. Keep the diagram inside the
    CodeRabbit-managed summary in the PR description and preserve the original
    description and all seven template sections. Use the existing ## Validation
    entries as the sole source of validation status and test execution evidence,
    preserving their recorded statuses and evidence.
  auto_review:
    drafts: true
    base_branches:
      - "^publish-v.*$"
      - "^codex/ci-and-pr-review$"
  tools:
    github-checks:
      enabled: false
